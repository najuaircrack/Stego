[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stego-tool"
version = "3.0.0"
description = "Steganography: hide arbitrary bytes inside PNG images"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Qevoryx" }]
keywords = ["steganography", "stego", "png", "codec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security :: Cryptography",
]
dependencies = ["Pillow>=10"]

[project.urls]
Homepage = "https://github.com/najuaircrack/Stego"
Repository = "https://github.com/najuaircrack/Stego"
Issues = "https://github.com/najuaircrack/Stego/issues"

[project.scripts]
stego = "stego_cli:main"

[tool.setuptools]
# Single modules (not packages): both ship at top level.
py-modules = ["stegolib", "stego_cli"]
