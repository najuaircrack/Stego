name: release

# Publishes the GitHub Release (binaries + notes) when a version tag
# is pushed (e.g. v2.1.1). Trigger on tags ONLY — never on branches.
on:
  push:
    tags:
      - 'v*'

# Releases need write access. Nothing else in this file does.
permissions:
  contents: write

# Tag pushes are rare and must never cancel each other mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Deterministic shell everywhere (pwsh): && / ||, $env:, 2>$null.
defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python (deterministic builds + tooling)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version consistency (tag must match every version source)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $verFile = Join-Path $env:GITHUB_WORKSPACE 'VERSION'
          if (-not (Test-Path $verFile)) {
            Write-Host "::error::VERSION not found; workspace contains:"
            Get-ChildItem $env:GITHUB_WORKSPACE | Select-Object Name
            exit 1
          }
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = (Get-Content $verFile -Raw).Trim()
          if ($tag -ne $ver) {
            Write-Host "::error::tag v$tag != VERSION $ver"
            exit 1
          }
          $checks = @(
            @('CMakeLists.txt', 'project\(stego VERSION ([\d.]+)'),
            @('python/pyproject.toml', '^version = "([\d.]+)"'),
            @('bindings/rust/stego/Cargo.toml', '^version = "([\d.]+)"'),
            @('bindings/rust/stego-sys/Cargo.toml', '^version = "([\d.]+)"'),
            @('src/api.cpp', 'return "([\d.]+)"')
          )
          foreach ($c in $checks) {
            $m = Select-String -Path $c[0] -Pattern $c[1] | Select-Object -First 1
            if (-not $m -or $m.Matches[0].Groups[1].Value -ne $ver) {
              Write-Host "::error::version drift in $($c[0])"
              exit 1
            }
          }
          Write-Host "version ok everywhere: $ver"

      - name: Configure + Build (x64 static lib)
        run: >
          cmake -S . -B build
          -G "Visual Studio 18 2026" -A x64 &&
          cmake --build build --config Release

      - name: Regenerate amalgamated header (must match committed)
        run: >
          python amalgamate.py build/stego_all.check.h &&
          git diff --no-index --quiet
          single_include/stego_all.h build/stego_all.check.h

      - name: Python dist (sdist + wheel)
        run: >
          python -m pip install --upgrade build &&
          python -m build python --outdir python/dist

      - name: Stage artifacts (fail loudly if anything is missing)
        shell: pwsh
        run: |
          $dst = Join-Path $env:GITHUB_WORKSPACE 'release-artifacts'
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          $wanted = @(
            'single_include/stego_all.h',
            'build/Release/stego.lib',
            'python/dist/stego_tool-*.tar.gz',
            'python/dist/stego_tool-*.whl'
          )
          foreach ($pattern in $wanted) {
            $found = @(Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE $pattern) -ErrorAction SilentlyContinue)
            if ($found.Count -eq 0) {
              Write-Host "::error::missing artifact for pattern: $pattern"
              exit 1
            }
            Copy-Item $found.FullName $dst -Force
          }
          Get-ChildItem $dst | Format-Table Name, Length -AutoSize

      - name: Extract release notes (this version's CHANGELOG section)
        shell: pwsh
        run: |
          $ver = (Get-Content (Join-Path $env:GITHUB_WORKSPACE 'VERSION') -Raw).Trim()
          $log = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'CHANGELOG.md') -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$ver\].*?(?=^## \[|\z)")
          if (-not $m.Success) {
            Write-Host "::error::no CHANGELOG section for [$ver]"
            exit 1
          }
          $m.Value.Trim() | Out-File (Join-Path $env:GITHUB_WORKSPACE 'release-notes.md') -Encoding UTF8
          Write-Host "notes extracted for $ver"

      - name: Publish GitHub Release (idempotent — updates if re-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = Get-ChildItem release-artifacts/* | ForEach-Object { $_.FullName }
          if (-not $files) { Write-Host "::error::no staged artifacts"; exit 1 }
          & gh release view $tag --json tagName -q .tagName 2>$null
          if ($?) {
            & gh release upload $tag $files --clobber
          } else {
            & gh release create $tag --title $tag --notes-file release-notes.md $files
          }
