name: release

# Runs ONLY when a version tag is pushed (e.g. v2.1.1).
# Builds release artifacts and publishes the GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create releases + upload artifacts

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    defaults:
      run:
        # Tag-triggered runs must not depend on ambient CWD: pin everything
        # to the checked-out tree (this exact failure bit us on v2.1.1).
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Version consistency (tag must match every version source)
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          if (-not $root) { $root = (Get-Location).Path }
          $verFile = Join-Path $root 'VERSION'
          if (-not (Test-Path $verFile)) {
            Write-Host "::error::VERSION not found at $verFile; workspace contains:"
            Get-ChildItem $root | Select-Object Name | Out-String | Write-Host
            exit 1
          }
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = (Get-Content $verFile -Raw).Trim()
          if ($tag -ne $ver) {
            Write-Host "::error::tag v$tag != VERSION $ver"
            exit 1
          }
          $checks = @(
            @('CMakeLists.txt', 'project\(stego VERSION ([\d.]+)'),
            @('python/pyproject.toml', '^version = "([\d.]+)"'),
            @('bindings/rust/stego/Cargo.toml', '^version = "([\d.]+)"'),
            @('bindings/rust/stego-sys/Cargo.toml', '^version = "([\d.]+)"'),
            @('src/api.cpp', 'return "([\d.]+)"')
          )
          foreach ($c in $checks) {
            $m = Select-String -Path $c[0] -Pattern $c[1] | Select-Object -First 1
            if (-not $m -or $m.Matches[0].Groups[1].Value -ne $ver) {
              Write-Host "::error::version drift in $($c[0])"
              exit 1
            }
          }
          Write-Host "version ok everywhere: $ver"

      - name: Configure + Build (x64 static lib)
        run: >
          cmake -S . -B build
          -G "Visual Studio 18 2026" -A x64 &&
          cmake --build build --config Release

      - name: Regenerate amalgamated header (must match committed)
        run: >
          python amalgamate.py build/stego_all.check.h &&
          git diff --no-index --quiet
          single_include/stego_all.h build/stego_all.check.h

      - name: Python dist (sdist + wheel)
        run: >
          python -m pip install --upgrade build &&
          python -m build python --outdir python/dist

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-artifacts -Force | Out-Null
          Copy-Item single_include/stego_all.h release-artifacts/
          Copy-Item build/Release/stego.lib release-artifacts/
          Copy-Item python/dist/* release-artifacts/
          Get-ChildItem release-artifacts | Format-Table Name, Length -AutoSize

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          --title "${{ github.ref_name }}"
          --notes-file CHANGELOG.md
          release-artifacts/*
