name: stego

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  msvc-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (tests + examples on for CI)
        run: >
          cmake -S . -B build
          -G "Visual Studio 18 2026" -A x64
          -DSTEGO_BUILD_TESTS=ON -DSTEGO_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --config Release
      - name: CTest (codec matrix incl. malformed/v1-compat)
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Amalgamation drift check (generated file must match)
        run: >
          python amalgamate.py build/stego_all.check.h &&
          git diff --no-index --quiet
          single_include/stego_all.h build/stego_all.check.h
      - name: Python suite (goldens, malformed, boundary, cross-impl, identity)
        run: >
          $env:STEGO_HARNESS = "build/Release/stego_harness.exe";
          $env:STEGO_AMALGAM = "build/Release/stego_amalgam.exe";
          python -m pytest tests/ -q

  msvc-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (x86)
        run: >
          cmake -S . -B build32
          -G "Visual Studio 18 2026" -A Win32
          -DSTEGO_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build32 --config Release
      - name: CTest
        run: ctest --test-dir build32 -C Release --output-on-failure

  gcc-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
      - name: Configure + Build (MinGW .a path)
        shell: msys2 {0}
        run: >
          cmake -S . -B build-mingw
          -G "MinGW Makefiles"
          -DSTEGO_BUILD_TESTS=ON &&
          cmake --build build-mingw &&
          ctest --test-dir build-mingw --output-on-failure

  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure + Build (GCC, lib + tests; GDI+ examples skipped)
        run: >
          cmake -S . -B build-linux
          -DSTEGO_BUILD_TESTS=ON &&
          cmake --build build-linux &&
          ctest --test-dir build-linux --output-on-failure

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow pytest
      - run: pytest tests/ -q -k "not cross"

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test --manifest-path bindings/rust/stego/Cargo.toml
