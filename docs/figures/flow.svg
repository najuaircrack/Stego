<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" font-family="ui-monospace, Consolas, monospace">
  <rect x="0" y="0" width="960" height="250" fill="#0d1117"/>
  <text x="24" y="32" font-size="19" font-weight="bold" fill="#ffffff">put a file in, get the same file out</text>

  <g font-size="11">
    <rect x="24" y="56" width="190" height="112" rx="8" fill="#161d27" stroke="#4b5871"/>
    <text x="40" y="84" font-size="13" font-weight="bold" fill="#ffffff">your file</text>
    <text x="40" y="108" fill="#c9d1d9">.exe  .zip  .sh  .bin</text>
    <text x="40" y="125" fill="#c9d1d9">anything goes in</text>
    <text x="40" y="150" fill="#8b949e">any type, any size</text>

    <line x1="214" y1="112" x2="262" y2="112" stroke="#8b949e" stroke-width="2"/>
    <polygon points="262,112 252,106 252,118" fill="#8b949e"/>
    <text x="214" y="100" fill="#ffffff">stego hide</text>

    <rect x="270" y="56" width="310" height="112" rx="8" fill="#161d27" stroke="#3f7fbf"/>
    <text x="286" y="84" font-size="13" font-weight="bold" fill="#ffffff">cover photo becomes stego.png</text>
    <text x="286" y="108" fill="#c9d1d9">opens fine everywhere,</text>
    <text x="286" y="125" fill="#c9d1d9">looks just the same</text>
    <text x="286" y="150" fill="#8b949e">ordinary PNG, nothing odd</text>

    <line x1="580" y1="112" x2="628" y2="112" stroke="#8b949e" stroke-width="2"/>
    <polygon points="628,112 618,106 618,118" fill="#8b949e"/>
    <text x="580" y="100" fill="#ffffff">stego reveal</text>

    <rect x="636" y="56" width="300" height="112" rx="8" fill="#161d27" stroke="#3aa655"/>
    <text x="652" y="84" font-size="13" font-weight="bold" fill="#ffffff">your file back</text>
    <text x="652" y="108" fill="#c9d1d9">bit for bit identical</text>
    <text x="652" y="125" fill="#c9d1d9">hashes match</text>
    <text x="652" y="150" fill="#8b949e">or you get a clear error</text>
  </g>

  <text x="24" y="202" font-size="11" fill="#c9d1d9">A wrong password or a tampered image gives a clean error. You never get half a file, and you never get garbage.</text>
</svg>
