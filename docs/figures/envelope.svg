<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="ui-monospace, Consolas, monospace">
  <style>
    .t { font-size: 20px; font-weight: bold; fill: #1a2233; }
    .s { font-size: 13px; font-weight: bold; fill: #1a2233; }
    .f { font-size: 11px; fill: #ffffff; }
    .fd { font-size: 11px; fill: #3a4763; }
    .n { font-size: 10px; fill: #6b7690; }
  </style>
  <text x="24" y="34" class="t">STG2 envelope headers (to scale, 14 px / byte)</text>

  <!-- v3 bar: 44B -->
  <text x="24" y="72" class="s">v3 — 44 bytes, header pixels [0,118)</text>
  <g transform="translate(24,84)">
    <rect x="0" width="56" height="34" fill="#d94f4f"/><text x="28" y="21" text-anchor="middle" class="f">magic 4</text>
    <rect x="56" width="28" height="34" fill="#7a8699"/><text x="70" y="21" text-anchor="middle" class="f">ver</text>
    <rect x="84" width="28" height="34" fill="#7a8699"/><text x="98" y="21" text-anchor="middle" class="f">flg</text>
    <rect x="112" width="56" height="34" fill="#3f7fbf"/><text x="140" y="21" text-anchor="middle" class="f">seed</text>
    <rect x="168" width="56" height="34" fill="#3f7fbf"/><text x="196" y="21" text-anchor="middle" class="f">orig</text>
    <rect x="224" width="56" height="34" fill="#3f7fbf"/><text x="252" y="21" text-anchor="middle" class="f">comp</text>
    <rect x="280" width="56" height="34" fill="#9aa3b2"/><text x="308" y="21" text-anchor="middle" class="f">rsv</text>
    <rect x="336" width="224" height="34" fill="#3aa655"/><text x="448" y="21" text-anchor="middle" class="f">salt 16</text>
    <rect x="560" width="56" height="34" fill="#c98a2b"/><text x="588" y="21" text-anchor="middle" class="f">crc</text>
    <text x="0" y="52" class="n">0</text><text x="608" y="52" text-anchor="end" class="n">44</text>
  </g>
  <text x="24" y="162" class="fd">body: ciphertext + data_crc32 [+ HMAC-32] · LSB replacement · optional scatter</text>

  <!-- v4 bar: 64B -->
  <text x="24" y="204" class="s">v4 — 64 bytes, header pixels [0,256) R/B only</text>
  <g transform="translate(24,216)">
    <rect x="0" width="56" height="34" fill="#d94f4f"/><text x="28" y="21" text-anchor="middle" class="f">magic 4</text>
    <rect x="56" width="28" height="34" fill="#7a8699"/><text x="70" y="21" text-anchor="middle" class="f">ver</text>
    <rect x="84" width="28" height="34" fill="#7a8699"/><text x="98" y="21" text-anchor="middle" class="f">flg</text>
    <rect x="112" width="56" height="34" fill="#3f7fbf"/><text x="140" y="21" text-anchor="middle" class="f">seed</text>
    <rect x="168" width="56" height="34" fill="#3f7fbf"/><text x="196" y="21" text-anchor="middle" class="f">orig</text>
    <rect x="224" width="56" height="34" fill="#3f7fbf"/><text x="252" y="21" text-anchor="middle" class="f">comp</text>
    <rect x="280" width="56" height="34" fill="#7c5cd6"/><text x="308" y="21" text-anchor="middle" class="f">Q</text>
    <rect x="336" width="224" height="34" fill="#3aa655"/><text x="448" y="21" text-anchor="middle" class="f">salt 16</text>
    <rect x="560" width="56" height="34" fill="#9aa3b2"/><text x="588" y="21" text-anchor="middle" class="f">rsv</text>
    <rect x="616" width="56" height="34" fill="#c98a2b"/><text x="644" y="21" text-anchor="middle" class="f">crc</text>
    <rect x="672" width="224" height="34" fill="#9aa3b2"/><text x="784" y="21" text-anchor="middle" class="f">reserved2 16</text>
    <text x="0" y="52" class="n">0</text><text x="888" y="52" text-anchor="end" class="n">64</text>
  </g>
  <text x="24" y="294" class="fd">body: ChaCha20-Poly1305(crc32 ‖ payload), full header as AAD · ternary ±1 · cost-ordered (ADAPTIVE)</text>

  <!-- legend -->
  <g transform="translate(24,316)" font-size="11">
    <rect x="0" y="-11" width="14" height="14" fill="#d94f4f"/><text x="19" y="0" class="fd">magic</text>
    <rect x="80" y="-11" width="14" height="14" fill="#3f7fbf"/><text x="99" y="0" class="fd">sizes/seed</text>
    <rect x="200" y="-11" width="14" height="14" fill="#3aa655"/><text x="219" y="0" class="fd">salt (KDF)</text>
    <rect x="320" y="-11" width="14" height="14" fill="#c98a2b"/><text x="339" y="0" class="fd">integrity</text>
    <rect x="430" y="-11" width="14" height="14" fill="#7c5cd6"/><text x="449" y="0" class="fd">v4 only (Q)</text>
    <rect x="560" y="-11" width="14" height="14" fill="#9aa3b2"/><text x="579" y="0" class="fd">reserved</text>
  </g>
</svg>
