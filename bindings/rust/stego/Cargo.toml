[package]
name = "stego"
version = "3.0.0"
edition = "2021"
description = "Steganography: hide arbitrary bytes inside PNG images (safe wrapper)"
license = "MIT"
repository = "https://github.com/najuaircrack/Stego"
homepage = "https://github.com/najuaircrack/Stego"
documentation = "https://github.com/najuaircrack/Stego/blob/main/docs/API.md"
